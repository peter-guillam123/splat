<svg viewBox="0 0 96 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Freefall pose: front view, limbs flailing. Light from top-left. -->
  <!-- far arm (right side of screen, slightly lower = broken symmetry) -->
  <g stroke-linecap="round" fill="none">
    <path d="M62 68 Q74 54 82 34" stroke="#d15a1e" stroke-width="10"/>
    <path d="M61 66 Q72 53 80 34" stroke="#f2762e" stroke-width="9"/>
    <!-- near arm, higher and wider -->
    <path d="M34 68 Q22 52 13 38" stroke="#d15a1e" stroke-width="10"/>
    <path d="M35 66 Q24 52 15 37" stroke="#f2762e" stroke-width="9"/>
    <!-- highlight on lit (left) arm -->
    <path d="M32 62 Q25 53 19 44" stroke="#ff9a52" stroke-width="3" opacity="0.8"/>
  </g>
  <!-- gloves -->
  <circle cx="13" cy="36" r="6.5" fill="#6b4a32"/>
  <circle cx="11.5" cy="34.5" r="2" fill="#8a6547" opacity="0.9"/>
  <circle cx="81" cy="32" r="6.5" fill="#5c3f2b"/>
  <!-- legs: bent out, different angles -->
  <g stroke-linecap="round" fill="none">
    <path d="M55 94 Q64 104 68 116" stroke="#d15a1e" stroke-width="11"/>
    <path d="M55 93 Q63 103 67 115" stroke="#f2762e" stroke-width="10"/>
    <path d="M41 94 Q33 106 30 114" stroke="#d15a1e" stroke-width="11"/>
    <path d="M41 93 Q34 105 31 113" stroke="#f2762e" stroke-width="10"/>
    <path d="M38 96 Q33 103 31 109" stroke="#ff9a52" stroke-width="3" opacity="0.7"/>
  </g>
  <!-- boots -->
  <ellipse cx="29" cy="118" rx="8" ry="6.5" fill="#6b4a32"/>
  <ellipse cx="26.5" cy="116" rx="2.5" ry="2" fill="#8a6547" opacity="0.9"/>
  <ellipse cx="69" cy="119" rx="8" ry="6.5" fill="#5c3f2b"/>
  <!-- torso: chunky jumpsuit -->
  <path d="M33 66 Q30 62 34 60 L62 60 Q66 62 63 66 L64 90 Q64 98 48 98 Q32 98 32 90 Z" fill="#f2762e"/>
  <!-- torso shadow side (right) -->
  <path d="M56 60 L62 60 Q66 62 63 66 L64 90 Q64 97 52 98 Q60 95 59 88 Z" fill="#d15a1e"/>
  <!-- torso lit edge -->
  <path d="M35 63 Q34 74 34.5 86" stroke="#ff9a52" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
  <!-- chest strap + buckle (harness for the chute) -->
  <path d="M33 72 L64 70" stroke="#6b4a32" stroke-width="5"/>
  <rect x="44" y="67.5" width="8" height="7" rx="1.5" fill="#f4d03f"/>
  <rect x="45" y="68.5" width="3" height="2" rx="1" fill="#fff3c2"/>
  <!-- AO where head sits on torso -->
  <ellipse cx="48" cy="62" rx="15" ry="4" fill="#000" opacity="0.15"/>
  <!-- head: big and round -->
  <circle cx="48" cy="42" r="22" fill="#e8a06c"/>
  <!-- head shadow (right/under) -->
  <path d="M60 24 A22 22 0 0 1 60 60 Q68 52 68 42 Q68 32 60 24" fill="#d18754"/>
  <path d="M30 52 A22 22 0 0 0 66 52 Q58 62 48 62 Q38 62 30 52" fill="#d18754" opacity="0.55"/>
  <!-- head lit sheen -->
  <path d="M32 32 Q36 24 44 22" stroke="#f7b98a" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.9"/>
  <!-- goggles: strap, gold rims, dark lenses -->
  <path d="M26 38 L70 36" stroke="#6b4a32" stroke-width="7"/>
  <circle cx="39" cy="38" r="9.5" fill="#f4d03f"/>
  <circle cx="58" cy="37" r="9.5" fill="#e0b52f"/>
  <circle cx="39" cy="38" r="7" fill="#3a3d4d"/>
  <circle cx="58" cy="37" r="7" fill="#3a3d4d"/>
  <!-- lens highlights: both catch light from top-left, off-centre -->
  <circle cx="36.5" cy="35.5" r="2.4" fill="#ffffff" opacity="0.85"/>
  <circle cx="55.5" cy="34.5" r="1.8" fill="#ffffff" opacity="0.7"/>
  <!-- nose + gleeful open mouth, slightly off-centre -->
  <ellipse cx="49" cy="47" rx="3" ry="2.4" fill="#d18754"/>
  <path d="M42 53 Q49 61 56 52 Q50 56 42 53" fill="#7a3b2e"/>
  <ellipse cx="49" cy="54.5" rx="4" ry="2.2" fill="#a04a38"/>
  <!-- blush on lit cheek -->
  <ellipse cx="32" cy="46" rx="3.5" ry="2.5" fill="#e8806c" opacity="0.55"/>
</svg>

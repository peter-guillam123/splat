<svg viewBox="0 0 128 96" xmlns="http://www.w3.org/2000/svg">
  <!-- Big slow gull, facing left, wings up. Soft-flat, light from top-left.
       Flip scaleX for rightward flight. -->
  <!-- tail -->
  <path d="M92 54 L126 42 Q125 56 121 62 L96 62 Z" fill="#4a6b7d"/>
  <path d="M96 55 L120 47 Q119 55 117 60 Z" fill="#3a5768"/>
  <!-- body -->
  <ellipse cx="68" cy="55" rx="31" ry="18" fill="#6b8ea3"/>
  <path d="M42 60 Q68 72 95 59 Q68 66 42 60 Z" fill="#52788d"/>
  <ellipse cx="62" cy="48" rx="22" ry="8" fill="#8aa8ba" opacity="0.6"/>
  <!-- head -->
  <circle cx="43" cy="48" r="14" fill="#6b8ea3"/>
  <path d="M35 38 Q40 35 46 36" stroke="#9fbccb" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- beak -->
  <path d="M31 46 L11 50 L31 55 Z" fill="#f2a83e"/>
  <path d="M31 50.5 L11 50 L31 55 Z" fill="#d98a28"/>
  <!-- eye -->
  <circle cx="38" cy="45" r="3.4" fill="#2a2f3d"/>
  <circle cx="36.8" cy="43.8" r="1.1" fill="#ffffff" opacity="0.85"/>
  <!-- near wing, raised -->
  <path d="M62 52 Q70 21 92 13 Q86 36 95 51 Q78 56 62 52 Z" fill="#41647a"/>
  <path d="M65 50 Q73 27 88 18 Q84 35 91 48 Q77 53 65 50 Z" fill="#587c90"/>
  <path d="M71 29 Q79 23 86 20" stroke="#8aa8ba" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
</svg>

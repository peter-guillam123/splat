<svg viewBox="0 0 64 80" xmlns="http://www.w3.org/2000/svg">
  <!-- A cartoon pineapple grenade with a lit fuse. Soft-flat, light top-left. -->
  <defs>
    <clipPath id="gbody"><ellipse cx="32" cy="52" rx="22" ry="24"/></clipPath>
  </defs>
  <!-- body -->
  <ellipse cx="32" cy="52" rx="22" ry="24" fill="#4e5a42"/>
  <path d="M43 32 A24 24 0 0 1 43 72 Q54 62 54 52 Q54 42 43 32" fill="#3a4432"/>
  <ellipse cx="24" cy="43" rx="9" ry="11" fill="#68734f" opacity="0.55"/>
  <!-- segment grid, clipped to the body so it curves off cleanly -->
  <g clip-path="url(#gbody)" stroke="#2c3424" stroke-width="1.6" opacity="0.5" fill="none">
    <path d="M8 44 H56"/><path d="M8 54 H56"/><path d="M8 64 H56"/>
    <path d="M24 28 V78"/><path d="M34 28 V78"/><path d="M44 28 V78"/>
  </g>
  <g clip-path="url(#gbody)" stroke="#5e6a4c" stroke-width="1" opacity="0.4" fill="none">
    <path d="M8 46 H56"/><path d="M26 28 V78"/>
  </g>
  <!-- cap -->
  <rect x="23" y="23" width="18" height="11" rx="2.5" fill="#555b3f"/>
  <rect x="23" y="23" width="18" height="4.5" rx="2.5" fill="#6b7250"/>
  <rect x="25" y="24.5" width="5" height="2" rx="1" fill="#8a9068" opacity="0.8"/>
  <!-- safety ring -->
  <circle cx="47" cy="27" r="4.2" fill="none" stroke="#8a8560" stroke-width="2.2"/>
  <!-- fuse -->
  <path d="M34 25 Q41 14 34 7" stroke="#6f5730" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M34 25 Q41 14 34 7" stroke="#9a7c4c" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- spark -->
  <circle cx="33" cy="6" r="6.5" fill="#ff8a2c" opacity="0.5"/>
  <circle cx="33" cy="6" r="3.8" fill="#ffb03c"/>
  <circle cx="33" cy="6" r="1.9" fill="#ffe6a0"/>
  <circle cx="27" cy="3" r="1" fill="#ffe6a0"/>
  <circle cx="39" cy="4" r="1.3" fill="#ff8a2c"/>
  <circle cx="35" cy="0.6" r="0.9" fill="#ffe6a0"/>
</svg>
